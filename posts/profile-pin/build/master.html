<!doctype html>
<meta charset="utf-8">
<style>
  /* 出力: 3106 x 1350 px
     内訳: 左ブリード33.75 + 表示部3037.5(1012.5 x 3列) + 右ブリード33.75
     Instagramのプロフィールグリッドは3:4に切り抜かれ、4:5投稿の左右が
     各34pxずつ削られる。その削られる分をブリードとして持たせている。 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html { width:3106px; height:1350px; background:#F6E3DE; }
  body { width:3106px; height:1350px; overflow:hidden; }
  body {
    background: linear-gradient(180deg,#FDF4F1 0%,#F9EAE5 55%,#F6E3DE 100%);
    font-family:'IPAPGothic','IPAGothic',sans-serif;
    color:#2E2A28;
  }
  .deco { position:absolute; top:0; left:0; display:block; }
  .stage { position:absolute; top:0; left:33.75px; width:3037.5px; height:1350px; display:flex; }
  .col {
    width:1012.5px; height:1350px; position:relative;
    padding:250px 100px 112px 100px; text-align:center;
    display:flex; flex-direction:column;
  }
  .kicker {
    font-size:36px; letter-spacing:.42em; color:#C1697A;
    font-weight:700; text-indent:.42em;
  }
  .kicker span { font-size:26px; vertical-align:.55em; letter-spacing:.1em; }
  .main {
    margin-top:100px;
    font-family:'IPAPMincho','IPAMincho',serif;
    font-size:112px; line-height:1.52; letter-spacing:.06em; color:#2A2523;
  }
  .main .sm { font-size:78px; }
  .sub {
    margin-top:76px; font-size:38px; line-height:2.0;
    letter-spacing:.09em; color:#7C6B66;
  }
  .foot {
    margin-top:auto; line-height:1.6;
    font-size:30px; letter-spacing:.24em; color:#B08C88; text-indent:.24em;
  }
  .en { font-family:'Liberation Serif',serif; letter-spacing:.16em; }
</style>

<svg class="deco" width="3106" height="1350" viewBox="0 0 3106 1350">
  <defs>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>
  <!-- 列の境目をまたぐ∞のモチーフ。継ぎ目そのものを図柄にして連続感を出す -->
  <g fill="none" stroke="#C9737F" stroke-opacity=".30" stroke-width="26" filter="url(#soft)">
    <circle cx="871"  cy="690" r="196"/>
    <circle cx="1223" cy="690" r="196"/>
    <circle cx="1884" cy="690" r="196"/>
    <circle cx="2236" cy="690" r="196"/>
  </g>
  <!-- 3列を貫く1本の細線。グリッドの隙間で途切れても1本に見える太さにしてある -->
  <line x1="0" y1="1140" x2="3106" y2="1140" stroke="#C9737F" stroke-opacity=".34" stroke-width="4"/>
</svg>

<div class="stage">
  <div class="col">
    <div class="kicker">01</div>
    <div class="main">思い込みを、<br>手放す。</div>
    <div class="sub"><span class="en">Release &amp; Awakening System</span><br>キネシオロジー × 眼球筋運動</div>
    <div class="foot">RAS<span style="font-size:20px;vertical-align:.6em">®</span> × 東北</div>
  </div>
  <div class="col">
    <div class="kicker">02</div>
    <div class="main">我慢を、<br>ほどく。</div>
    <div class="sub">「私さえ我慢すれば」<br>そう言ってきた あなたへ</div>
    <div class="foot">宮城県大郷町</div>
  </div>
  <div class="col">
    <div class="kicker">03</div>
    <div class="main"><span class="sm">体験・無料相談</span><br>受付中</div>
    <div class="sub">オンライン / 対面<br>プロフィールのリンクから</div>
    <div class="foot">ファシリテーター AKEMI</div>
  </div>
</div>
